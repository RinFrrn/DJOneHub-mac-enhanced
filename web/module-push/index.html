<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fa">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <title>DJOneHub 提醒</title>
</head>
<body>
<main>
  <img class="mark" src="./icon.svg" width="56" height="56" alt="">
  <p class="eyebrow">DJONEHUB</p>
  <h1>模块有消息，<br>手机来提醒。</h1>
  <p class="intro">收到模块的来电与短信提醒。接听电话或阅读短信，请打开 DJOneHub App。</p>
  <section aria-labelledby="setup-title">
    <h2 id="setup-title">连接此 iPhone</h2>
    <ol>
      <li>在 Safari 分享菜单中选择<strong>添加到主屏幕</strong>，再从主屏幕打开。</li>
      <li>粘贴模块生成的通知公钥，点击允许提醒。</li>
      <li>导出配对文件，在模块上导入，然后发送测试通知。</li>
    </ol>
    <label for="public-key">模块通知公钥</label>
    <textarea id="public-key" rows="3" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="粘贴初始化时显示的 public key"></textarea>
    <p class="hint">这里只需要公钥。不要粘贴私钥、Bark 地址或短信内容。</p>
    <button id="subscribe" type="button">允许提醒</button>
    <div class="actions">
      <button id="download" class="secondary" type="button" disabled>导出配对文件</button>
      <button id="copy" class="secondary" type="button" disabled>复制配对内容</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在检查通知支持…</p>
  </section>
  <p class="privacy">配对信息只保存在此设备，导出后交给你的模块。通知由模块直接发往浏览器推送服务，本站不转发或保存短信。提醒受网络、通知权限和专注模式影响。</p>
  <button id="disconnect" class="text-button" type="button">停止此网页的提醒</button>
</main>
<script src="./app.js" defer></script>
</body>
</html>
